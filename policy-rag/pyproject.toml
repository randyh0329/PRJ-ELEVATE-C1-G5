[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag"
version = "0.1.0"
description = "FAISS-backed grounded retrieval over the Altostrat Singapore HR handbook and its OKF bundle, served over A2A"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.9,<2",
    "numpy>=1.26",
    "PyYAML>=6",
    "a2a-sdk[http-server]>=1.1,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]
vertex = ["google-cloud-aiplatform>=1.60"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
policy-rag = "policy_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
