version: '3.8'

services:
  mock-backends:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.mocks.app:mock_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - FIDELITY_PROFILE=integration-test
      - TEST_AUTH_SECRET=elevate-test-secret-key-2026
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.gateway.app:gateway_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - WORKWEEK_MOCK_URL=http://mock-backends:8080/api/v1
      - ITSM_MOCK_URL=http://mock-backends:8080/api/v1
      - MOCK_BUILD=false
      - TEST_AUTH_SECRET=elevate-test-secret-key-2026
    depends_on:
      mock-backends:
        condition: service_healthy
