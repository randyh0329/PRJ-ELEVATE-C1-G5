name: Build & Deploy Multi-Agent Service to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - 'requirements.txt'
      - 'Dockerfile*'
      - 'tests/**'
      - 'terraform/**'
      - 'agents-cli-manifest.yaml'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

env:
  PROJECT_ID: pe-group5
  REGION: us-central1
  SERVICE_NAME_ORCHESTRATOR: hr-agentic-service
  SERVICE_NAME_POLICY_RAG: hr-policy-rag-service
  SERVICE_NAME_SAAS_ADAPTER: saas-integration-adapters
  ARTIFACT_REPO: hr-agentic-repo
  WIF_PROVIDER: projects/549227441635/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  WIF_SERVICE_ACCOUNT: github-deployer-sa@pe-group5.iam.gserviceaccount.com

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Policy RAG Local Index
        run: |
          python -m src.grounding.policy_rag.cli ingest

      - name: Execute Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  deploy-agent-runtime:
    name: Deploy to Vertex AI Agent Runtime & Registry
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r agent_registry_deployment/scripts/requirements.txt

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Enterprise Multi-Agent Fleet to Agent Registry
        env:
          PYTHONPATH: .
        run: |
          python agent_registry_deployment/scripts/deploy_to_agent_registry.py \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }}

      - name: Verify Agent Registry Fleet Deployment
        env:
          PYTHONPATH: .
        run: |
          python agent_registry_deployment/scripts/verify_agent_registry.py \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }}

  build-and-deploy-cloud-run:
    name: Build Container & Deploy to Cloud Run
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Images (Parallel Accelerated)
        run: |
          export DOCKER_BUILDKIT=1
          TAG_ORCH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME_ORCHESTRATOR }}"
          TAG_RAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME_POLICY_RAG }}"
          TAG_SAAS="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME_SAAS_ADAPTER }}"

          echo "📦 [1/3] Building Orchestrator Image (Warming shared dependency layers)..."
          docker build -f Dockerfile.orchestrator \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            -t ${TAG_ORCH}:${{ github.sha }} -t ${TAG_ORCH}:latest .

          echo "📦 [2/3 & 3/3] Building Policy RAG and SaaS Adapter Images in parallel..."
          docker build -f Dockerfile.policy_rag \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            -t ${TAG_RAG}:${{ github.sha }} -t ${TAG_RAG}:latest . &
          PID_RAG=$!

          docker build -f Dockerfile.saas_adapter \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            -t ${TAG_SAAS}:${{ github.sha }} -t ${TAG_SAAS}:latest . &
          PID_SAAS=$!

          wait $PID_RAG
          wait $PID_SAAS

          echo "🚀 Concurrently pushing all 3 images (SHA + latest tags) to Artifact Registry..."
          docker push ${TAG_ORCH}:${{ github.sha }} &
          docker push ${TAG_ORCH}:latest &
          docker push ${TAG_RAG}:${{ github.sha }} &
          docker push ${TAG_RAG}:latest &
          docker push ${TAG_SAAS}:${{ github.sha }} &
          docker push ${TAG_SAAS}:latest &
          wait
          echo "✅ All 3 microservice images successfully pushed!"

      - name: Deploy All 3 Cloud Run Services in Parallel
        id: deploy
        run: |
          echo "🚀 Launching concurrent Cloud Run deployments for all 3 services..."

          # No --allow-unauthenticated / --no-allow-unauthenticated below. Those
          # flags make gcloud rewrite the service's IAM policy on every deploy,
          # and two things are wrong with that here:
          #
          #   1. The deployer holds roles/run.developer (terraform/main.tf:197),
          #      which does not include run.services.setIamPolicy. So the attempt
          #      fails and prints "Setting IAM policy failed, try gcloud beta run
          #      services remove-iam-policy-binding ...", which looks alarming and
          #      is easy to mistake for the cause of a failed deploy.
          #   2. Terraform already owns these bindings - `public_invoker` for the
          #      orchestrator, per-caller `run.invoker` grants for the two private
          #      services. Re-asserting them from CI is a second writer to one
          #      policy, and the two disagree the moment either side changes.
          #
          # Omitting the flags leaves an existing service's IAM untouched, which
          # is what we want: Terraform decides who may invoke, CI decides what
          # code runs. Granting the deployer roles/run.admin would also silence
          # the warning, at the cost of letting CI change who can call production.

          # The startup probe is set here, on every deploy, because nothing in
          # this repository runs `terraform apply`. terraform/main.tf describes
          # these services but is not the thing that creates their revisions -
          # `gcloud run deploy` is, and it inherits whatever the live service
          # already has. Raising the budget in Terraform alone changed no
          # deployed setting: revision hr-policy-rag-service-00009-vgq was still
          # created with "up to 35s for the configured startup probe" and still
          # rejected. Whatever is not on this command line does not ship.
          #
          # 10 + 23*10 = 240s, the Cloud Run maximum, matching Terraform so the
          # two do not disagree. A healthy container answers the first probe and
          # the remaining attempts never happen; failure_threshold only bounds
          # how long a broken container takes to be *declared* broken.
          PROBE_TIMING="initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=10,failureThreshold=23"

          IMAGE_TAG_RAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME_POLICY_RAG }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME_POLICY_RAG }} \
            --image "${IMAGE_TAG_RAG}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "policy-rag-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --cpu 2 \
            --memory 2Gi \
            --startup-probe "${PROBE_TIMING},httpGet.path=/healthz,httpGet.port=8080" \
            --quiet &
          PID_DEPLOY_RAG=$!

          IMAGE_TAG_SAAS="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME_SAAS_ADAPTER }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME_SAAS_ADAPTER }} \
            --image "${IMAGE_TAG_SAAS}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "saas-adapter-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "SAAS_MCP_CREDENTIAL=saas-mcp-token:latest" \
            --startup-probe "${PROBE_TIMING},httpGet.path=/health,httpGet.port=8080" \
            --quiet &
          PID_DEPLOY_SAAS=$!

          IMAGE_TAG_ORCH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME_ORCHESTRATOR }}:${{ github.sha }}"
          # Runtime identity is `hr-agent-runner-sa`. `cloud_run_sa` is only the
          # Terraform resource label (terraform/main.tf:92-96), not the account_id,
          # and deploying as a name that does not exist is what produced
          # PERMISSION_DENIED "... denied on service account (or it may not exist)".
          gcloud run deploy ${{ env.SERVICE_NAME_ORCHESTRATOR }} \
            --image "${IMAGE_TAG_ORCH}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "hr-agent-runner-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars "ENABLE_AGENT_REGISTRY_API=true,GCP_PROJECT_ID=${{ env.PROJECT_ID }},AGENT_REGISTRY_LOCATION=${{ env.REGION }},USE_LIVE_MCP=true,DEFAULT_CALLER_ID=EMP-509" \
            --set-secrets "SAAS_MCP_CREDENTIAL=saas-mcp-token:latest" \
            --startup-probe "${PROBE_TIMING},httpGet.path=/health,httpGet.port=8080" \
            --quiet &
          PID_DEPLOY_ORCH=$!

          wait $PID_DEPLOY_RAG
          wait $PID_DEPLOY_SAAS
          wait $PID_DEPLOY_ORCH
          echo "✅ All 3 Cloud Run services successfully deployed in parallel!"

      - name: Verify All Cloud Run Services Deployment
        run: |
          echo "================================================================="
          echo "🚀 Verifying All 3 Cloud Run Services in ${{ env.REGION }}"
          echo "================================================================="
          for SVC in ${{ env.SERVICE_NAME_ORCHESTRATOR }} ${{ env.SERVICE_NAME_POLICY_RAG }} ${{ env.SERVICE_NAME_SAAS_ADAPTER }}; do
            URL=$(gcloud run services describe ${SVC} --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "not-deployed")
            REV=$(gcloud run services describe ${SVC} --region ${{ env.REGION }} --format 'value(status.latestReadyRevisionName)' 2>/dev/null || echo "none")
            echo "• Service ${SVC}: URL=${URL}, Revision=${REV}"
          done
          echo "================================================================="



